<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 218 46" fill="none" role="img" aria-label="SM Seaside City Cebu">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#A8832A"/>
    </linearGradient>
  </defs>

  <!-- Gold rounded square icon -->
  <rect x="0" y="3" width="40" height="40" rx="7" fill="url(#gold)"/>

  <!-- "SM" white serif inside box -->
  <text
    x="20" y="29"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.8">SM</text>

  <!-- Subtle underline inside box -->
  <rect x="10" y="33" width="20" height="1" rx="0.5" fill="#fff" opacity="0.35"/>

  <!-- Hairline vertical separator -->
  <rect x="52" y="11" width="0.8" height="24" rx="0.4" fill="#C9A84C" opacity="0.4"/>

  <!-- "SEASIDE" spaced caps -->
  <text x="62" y="25"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="9"
    font-weight="600"
    fill="#1a1410"
    letter-spacing="3.8">SEASIDE</text>

  <!-- "CITY · CEBU" lighter -->
  <text x="62" y="37"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="7.2"
    font-weight="300"
    fill="#8a7660"
    letter-spacing="4">CITY · CEBU</text>
</svg>
