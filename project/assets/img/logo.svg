<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" fill="none" role="img" aria-label="SM Seaside City Cebu">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#A8832A"/>
    </linearGradient>
  </defs>

  <!-- Gold rounded square icon -->
  <rect x="0" y="2" width="48" height="48" rx="8" fill="url(#gold)"/>

  <!-- "SM" white serif inside box -->
  <text
    x="24" y="33"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1">SM</text>

  <!-- Subtle underline inside box -->
  <rect x="12" y="38" width="24" height="1" rx="0.5" fill="#fff" opacity="0.35"/>

  <!-- Hairline vertical separator -->
  <rect x="62" y="10" width="0.8" height="30" rx="0.4" fill="#C9A84C" opacity="0.4"/>

  <!-- "SEASIDE" spaced caps -->
  <text x="74" y="28"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="12"
    font-weight="600"
    fill="#1a1410"
    letter-spacing="4">SEASIDE</text>

  <!-- "CITY · CEBU" lighter -->
  <text x="74" y="43"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="9.5"
    font-weight="300"
    fill="#8a7660"
    letter-spacing="4.5">CITY · CEBU</text>
</svg>
