<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 62" fill="none" role="img" aria-label="SM Seaside City Cebu">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#A8832A"/>
    </linearGradient>
  </defs>

  <!-- Gold rounded square icon -->
  <rect x="0" y="2" width="56" height="56" rx="9" fill="url(#gold)"/>

  <!-- "SM" white serif inside box -->
  <text
    x="28" y="38"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1.5">SM</text>

  <!-- Subtle underline inside box -->
  <rect x="14" y="44" width="28" height="1.2" rx="0.5" fill="#fff" opacity="0.35"/>

  <!-- Hairline vertical separator -->
  <rect x="72" y="10" width="1" height="38" rx="0.5" fill="#C9A84C" opacity="0.5"/>

  <!-- "SEASIDE" spaced caps -->
  <text x="86" y="30"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#1a1410"
    letter-spacing="5">SEASIDE</text>

  <!-- "CITY · CEBU" lighter -->
  <text x="86" y="48"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="12"
    font-weight="500"
    fill="#7a6650"
    letter-spacing="5">CITY · CEBU</text>
</svg>
